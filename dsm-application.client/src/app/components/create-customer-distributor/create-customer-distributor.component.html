<div class="customer-container">
  <h2>Create Customer (Distributor)</h2>
  <form (ngSubmit)="createCustomer()">
    <input type="text" placeholder="Name" [(ngModel)]="customer.name" name="name" required />
    <input type="email" placeholder="Email" [(ngModel)]="customer.email" name="email" required />
    <input type="text" placeholder="Phone" [(ngModel)]="customer.phoneNumber" name="phoneNumber" />
    <button type="submit">Create</button>
  </form>
  <p class="message text-green-600">{{ message }}</p>

  <!-- Customer List Table -->
  <table class="customer-table" *ngIf="customers.length > 0">
    <thead>
      <tr> 
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Registered</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let c of customers">
        <td>{{ c.name }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.phoneNumber }}</td>
        <td>{{ c.isRegistered ? 'Yes' : 'No' }}</td>
      </tr>
    </tbody>
  </table>
</div>
