<div class="distributors-section">
  <div *ngIf="loading" class="loading-state">
    <i class="fas fa-spinner fa-spin"></i>
    <span>Loading distributors...</span>
  </div>

  <div *ngIf="!loading && distributors.length" class="distributors-content">
    <div class="distributors-grid">
      <div class="distributor-card" *ngFor="let d of distributors">
        <div class="distributor-header">
          <h4>{{ d.companyName }}</h4>
      <span class="status-badge" [class]="(d.status || '').toLowerCase()">

            {{ d.status || 'Available' }}
          </span>
        </div>
        
      <div class="distributor-info">
  <p><i class="fas fa-user"></i> {{ d.name }}</p>
  <p><i class="fas fa-envelope"></i> {{ d.email }}</p>
  <p><i class="fas fa-phone"></i> {{ d.phoneNumber }}</p>
  <p *ngIf="d.address"><i class="fas fa-map-marker-alt"></i> {{ d.address }}</p>
  <p><i class="fas fa-tags"></i> {{ d.categories }}</p>

  <!-- ⭐ Average Rating Block -->
  <div class="rating-stars" *ngIf="d.averageRating !== undefined">
    <span *ngFor="let star of getStars(d.averageRating)">
      <i
        class="fas"
        [class.fa-star]="star <= d.averageRating"
        [class.fa-star-half-alt]="star - 0.5 === d.averageRating"
        [class.fa-star-o]="star > d.averageRating"
      ></i>
    </span>

    <span class="rating-value">
      {{ d.averageRating }}/5 ({{ d.reviewCount }} reviews)
    </span>
  </div>
</div>

        <div class="distributor-actions">
          <!-- View Products Button -->
          <!-- <button class="btn btn-outline-primary" 
                  *ngIf="d.status === 'Accepted'"
                  (click)="viewProducts(d.distributorId)">
            View Products
          </button> -->

          <!-- Connect Button -->
          <!-- <button class="btn btn-primary"
                  *ngIf="dashboardType === 'global'" 
                  [disabled]="d.status === 'Pending' || d.status === 'Accepted'"

            {{ d.status === 'Pending'
              ? 'Pending'

              ? 'Connected'
              : 'Connect' }}
          </button> -->

              <!-- Connect Button -->
          <button class="btn btn-primary"
        *ngIf="dashboardType === 'global'"
        [disabled]="!d.canConnect || d.status === 'Pending' || d.status === 'Accepted'"
        (click)="connectDistributor(d.distributorId)">

    {{ 
  !d.canConnect
    ? 'Connected'
    : d.status === 'Pending'
      ? 'Pending'
      : d.status === 'Accepted'
        ? 'Connected'
        : 'Connect'
}}

          </button>
           <!-- ⭐ REPORT FRAUD BUTTON (FOR CUSTOMER REPORTING DISTRIBUTOR) -->
          <button class="btn btn-danger mt-2"
                  [routerLink]="[
                    '/report-fraud',
                    'distributor',
                    d.distributorId
                  ]">
            <i class="fas fa-flag"></i> Report
          </button>
          <button class="btn btn-warning mt-2"
        [routerLink]="[
          '/review',
          'Distributor',
          d.distributorId
        ]">
  <i class="fas fa-star"></i> Review
</button>

        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && !distributors.length" class="no-distributors">
    <i class="fas fa-truck"></i>
    <h3>No Distributors Found</h3>
    <p>There are no distributors available at the moment.</p>
  </div>
</div>
