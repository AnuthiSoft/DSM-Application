<div class="p-4">
  <h2 class="text-xl font-bold">Customer Login</h2>
  <form (ngSubmit)="login()" class="flex flex-col gap-2">
    <input type="email" placeholder="Email" [(ngModel)]="request.email" name="email" required />
    <input type="password" placeholder="Password" [(ngModel)]="request.password" name="password" required />
    <button type="submit">Login</button>
  </form>
  <p class="text-blue-600">{{ message }}</p>
</div>
