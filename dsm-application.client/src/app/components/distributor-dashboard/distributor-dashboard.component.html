<div class="body">
  <!-- Sidebar Navigation -->
  <div class="dashboard-sidebar">
    <div class="sidebar-header">
      <h3><i class="fas fa-building"></i> <span>BusinessPortal</span></h3>
    </div>
    <div class="nav-items">
      <div class="nav-item" [class.active]="isActive('dashboard')" (click)="setActiveTab('dashboard')">
        <i class="fas fa-th-large"></i> <span>Dashboard</span>
      </div>

      <div class="nav-item" [class.active]="isActive('products')" (click)="setActiveTab('products')">
        <i class="fas fa-box"></i> <span>Products</span>
      </div>

      <div class="nav-item" [class.active]="isActive('employees')" (click)="setActiveTab('employees')">
        <i class="fas fa-users"></i> <span>Employees</span>
      </div>

      <div class="nav-item" [class.active]="isActive('customers')" (click)="setActiveTab('customers')">
        <i class="fas fa-user-plus"></i> <span>Create Customer</span>
      </div>

      <div class="nav-item" [class.active]="isActive('orders')" (click)="setActiveTab('orders')">
        <i class="fas fa-shopping-cart"></i> <span>Orders</span>
      </div>
      <div class="nav-item" [class.active]="isActive('connectionrequests')"
        (click)="setActiveTab('connectionrequests')">
        <i class="fas fa-users"></i> <span>Connection Requests</span>
      </div>

      <div class="nav-item" [class.active]="isActive('reports')" (click)="setActiveTab('reports')">
        <i class="fas fa-chart-bar"></i> <span>Reports</span>
      </div>

      <div class="nav-item" [class.active]="isActive('settings')" (click)="setActiveTab('settings')">
        <i class="fas fa-cog"></i> <span>Settings</span>
      </div>
        <div class="nav-item" [class.active]="isActive('settings')" (click)="setActiveTab('settings')">
        <i class="fas fa-clipboard-check"></i> <span>mmmm</span>
      </div>

      <div class="nav-item" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="dashboard-main">
    <!-- Dashboard Tab -->
    <div class="tab-content active" *ngIf="isActive('dashboard')">
      <div class="welcome-header">
        <h2>Dashboard Overview</h2>
        <!-- <div class="date-display">Monday, October 16, 2023</div> -->
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-shopping-bag"></i></div>
          <div class="stat-value">142</div>
          <div class="stat-label">Total Orders</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-box"></i></div>
          <div class="stat-value">56</div>
          <div class="stat-label">Products</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-users"></i></div>
          <div class="stat-value">24</div>
          <div class="stat-label">Customers</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-dollar-sign"></i></div>
          <div class="stat-value">$12,458</div>
          <div class="stat-label">Revenue</div>
        </div>
      </div>

      <div class="dashboard-card">
        <h3>Recent Activity</h3>
        <p>Your recent dashboard activity will appear here.</p>
      </div>
    </div>

    <!-- Products Tab -->
    <app-products *ngIf="activeTab === 'products'"></app-products>
    <app-employees *ngIf="activeTab === 'employees'"></app-employees>
    <app-create-customer-distributor *ngIf="activeTab === 'customers'"></app-create-customer-distributor>
    <!-- Employees Tab -->
    <app-distributor-orders *ngIf="activeTab === 'orders'"></app-distributor-orders>
    <app-distributor-connection-requests *ngIf="activeTab === 'connectionrequests'"></app-distributor-connection-requests>



   


  </div>
</div>
