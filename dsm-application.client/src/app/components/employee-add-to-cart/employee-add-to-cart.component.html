<div class="page-wrapper">
  <div class="order-container">

    <h2>CashCollector Order Request</h2>

    <!-- Ordered Date -->
    <div class="form-group">
      <label>Ordered Date *</label>
      <input type="date"
             [(ngModel)]="orderedDate"
             (change)="updateExpectedDate()" />
    </div>

    <!-- Retailer -->
    <div class="form-group">
      <label>Retailer *</label>

      <div class="customer-box">
        <div class="customer-display"
             (click)="toggleCustomerDropdown()">
          {{ customerDisplay || customerName }}
          <span class="arrow">▼</span>
        </div>

        <div class="customer-dropdown"
             *ngIf="showCustomerDropdown">
          <small>ID: {{ customerId }}</small><br />
          <small>Email: {{ customerEmail }}</small><br />

          <div class="customer-item"
               *ngFor="let c of customers"
               (click)="selectCustomer(c)">
            <strong>{{ c.customerName }}</strong><br />
            <small>ID: {{ c.customerId }}</small><br />
            <small>Email: {{ c.email }}</small><br />
            <small>Phone: {{ c.phoneNumber }}</small>
          </div>
        </div>
      </div>
    </div>

    <!-- Expected Delivery -->
    <div class="form-group">
      <label>Expected Delivery Date *</label>
      <input type="date"
             [(ngModel)]="expectedDate"
             readonly />
    </div>

    <!-- Products -->
    <h3>Products *</h3>

    <table class="product-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Quantity</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of cart">
          <td>
            <div class="product-box">
              <span class="product-name">
                {{ item.product.productName }}
              </span>

              <button class="remove-btn"
                      (click)="removeFromCart(item.product.productId!)"
>
                ✖
              </button>
            </div>
          </td>

          <td class="quantity-cell">
            <input type="number"
                   [(ngModel)]="item.quantity"
                   min="1" />
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Actions -->
    <div class="actions">
      <button class="submit-btn"
              (click)="placeOrder()">
        Submit
      </button>

      <button class="reset-btn"
              (click)="resetOrder()">
        Reset
      </button>

       <!-- ⬅️ BACK TO PRODUCTS (Floating) -->
<div class="floating-back-btn" (click)="close.emit()">
  <i class="fas fa-arrow-left"></i>
  <span>Back to Products</span>
</div>

    </div>

  </div>

  <!-- <button class="btn btn-outline-secondary mb-3" (click)="close.emit()">
  ← Back to Products
</button> -->

</div>
