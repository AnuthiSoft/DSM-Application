<div class="main-box">
  <div class="invoice-box">
    <h2>My Invoices</h2>
    <hr>
    <div *ngFor="let inv of invoices" class="invoice-item">
      <p><strong>Uploaded On:</strong> {{ inv.uploadedOn | date:'medium' }}</p>

      <a [href]="inv.pdfUrl" target="_blank" class="pdf-link">
        View PDF
      </a>
    </div>

  </div>
</div>
