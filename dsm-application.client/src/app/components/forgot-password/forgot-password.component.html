<div class="forgot-password-container">
  <h2>Forgot Password</h2>

  <!-- Step 1: Enter Email -->
  <div *ngIf="step === 1" class="step">
    <input type="email" [(ngModel)]="email" placeholder="Enter your email" class="form-control">
    <button (click)="sendOtp()" class="btn btn-primary mt-2">Send OTP</button>
  </div>

  <!-- Step 2: Enter OTP -->
  <div *ngIf="step === 2" class="step">
    <input type="text" [(ngModel)]="otp" placeholder="Enter OTP" class="form-control">
    <button (click)="verifyOtp()" class="btn btn-primary mt-2">Verify OTP</button>
  </div>

  <!-- Step 3: Reset Password -->
  <div *ngIf="step === 3" class="step">
    <input type="password" [(ngModel)]="newPassword" placeholder="New Password" class="form-control mb-2">
    <input type="password" [(ngModel)]="confirmPassword" placeholder="Confirm Password" class="form-control mb-2">
    <button (click)="resetPassword()" class="btn btn-success">Reset Password</button>
  </div>

  <p class="text-info mt-3">{{ message }}</p>
</div>
