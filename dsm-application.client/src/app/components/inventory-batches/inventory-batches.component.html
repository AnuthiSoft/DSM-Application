<div class="dashboard-main">
  <div class="dashboard-card">
    <h2 class="page-title">Inventory Batches</h2>

    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>#</th>
            <th>Product</th>
            <th>Code</th>
            <th>Initial Qty</th>
            <th>Available Qty</th>
            <th>MFG</th>
            <th>EXP</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let row of paginatedRows; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ row.productName }}</td>
            <td>{{ row.productCode }}</td>
            <td>{{ row.initialQuantity }}</td>
            <td>
              <span class="quantity-badge" [class.danger]="row.quantityAvailable === 0"
                [class.warning]="row.availableQuantity <= 5 && row.availableQuantity > 0"
                [class.success]="row.availableQuantity > 5">
                {{ row.quantityAvailable }}
              </span>
            </td>
            <td>
              <input type="date" class="form-control form-control-sm date-input"
                [ngModel]="row.manufactureDate ? (row.manufactureDate | date:'yyyy-MM-dd') : null"
                (ngModelChange)="updateBatchDates(row, $event, 'mfg')" />
            </td>
            <td>
              <input type="date" class="form-control form-control-sm date-input"
                [ngModel]="row.expiryDate ? (row.expiryDate | date:'yyyy-MM-dd') : null"
                (ngModelChange)="updateBatchDates(row, $event, 'exp')" />
            </td>
            <td>
              <span class="status-badge" [class.expired]="getStatus(row.expiryDate) === 'Expired'"
                [class.near-expiry]="getStatus(row.expiryDate) === 'Near Expiry'"
                [class.valid]="getStatus(row.expiryDate) === 'Valid'"
                [class.not-set]="getStatus(row.expiryDate) === 'Not Set'">
                {{ getStatus(row.expiryDate) }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 🔥 PAGINATION OUTSIDE -->
    <!-- Desktop Pagination -->
    <div class="desktop-pagination" *ngIf="totalPages > 1">

      <button class="page-btn" [disabled]="currentPage === 1" (click)="prevPage()">
        <i class="fas fa-chevron-left"></i> Previous
      </button>

      <div class="page-numbers">
        <span *ngFor="let page of getPageNumbers()" class="page-number" [class.active]="page === currentPage"
          [class.disabled]="page === '...'" (click)="goToPage(page)">
          {{ page }}
        </span>
      </div>

      <button class="page-btn" [disabled]="currentPage === totalPages" (click)="nextPage()">
        Next <i class="fas fa-chevron-right"></i>
      </button>

    </div>

    <!-- Mobile Pagination -->
    <div class="mobile-pagination" *ngIf="totalPages > 1">

      <button class="mobile-nav" [disabled]="currentPage === 1" (click)="prevPage()">
        ←
      </button>

      <div class="mobile-info">
        Page {{ currentPage }} of {{ totalPages }}
      </div>

      <button class="mobile-nav" [disabled]="currentPage === totalPages" (click)="nextPage()">
        →
      </button>

    </div>

  </div>
</div>
