<h2>Main Inventory</h2>

<div class="search-box mb-3">
  <input class="form-control" placeholder="Search..." [(ngModel)]="searchTerm" (input)="onSearch()">
</div>
<div class="inventory-charts-section">

  <h3>Stock Distribution (Pie Chart)</h3>
  <canvas id="pieChart"></canvas>

  <h3 style="margin-top:10px;">Stock Levels (Bar Chart)</h3>
  <canvas id="barChart"></canvas>

</div>

<table class="table table-bordered table-striped">
  <thead class="table-dark">
    <tr>
      <th>Product</th>
      <th>Code</th>
      <th>Measure</th>
      
      <th>Available Stock</th>
      <th>Reorder</th>
      <th>Updated</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let s of filteredStock">
      <td>{{ s.productName }}</td>
      <td>{{ s.productCode }}</td>
      <td>{{ s.measure }}</td>
      
      
      <td [ngClass]="{
    'low-stock': s.currentStock <= 5,
    'medium-stock': s.currentStock > 5 && s.currentStock <= 20,
    'high-stock': s.currentStock > 20
  }">
        {{ s.currentStock }}
      </td>
      <td>{{ s.reorderLevel }}</td>
      <td>{{ s.updatedAt | date:'short' }}</td>
    </tr>
  </tbody>
</table>
