<div class="tab-content active" *ngIf="isActive('payments')">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-left">
      <h2 class="page-title">
        <i class="fas fa-credit-card"></i> Payments Management
      </h2>
      <div class="page-subtitle">
        Manage payments, handovers, and customer payment status
      </div>
    </div>
    <div class="header-right">
      <div class="date-display">{{currentDate | date:'fullDate'}}</div>
    </div>
  </div>

  <!-- TOP SECTION TABS - Horizontal at the top -->
  <div class="horizontal-tabs">
    <div class="tabs-container">
      <button
        class="horizontal-tab-btn"
        [class.active]="activeSection === 'reports'"
        (click)="switch('reports')">
        <div class="tab-icon">
          <i class="fas fa-chart-bar"></i>
        </div>
        <div class="tab-content">
          <span class="tab-title">Reports</span>
          <span class="tab-subtitle">Payment Analytics</span>
        </div>
      </button>

      <button
        class="horizontal-tab-btn"
        [class.active]="activeSection === 'handovers'"
        (click)="switch('handovers')">
        <div class="tab-icon">
          <i class="fas fa-exchange-alt"></i>
        </div>
        <div class="tab-content">
          <span class="tab-title">Handovers</span>
          <span class="tab-subtitle">Cash Management</span>
        </div>
      </button>

      <button
        class="horizontal-tab-btn"
        [class.active]="activeSection === 'customers'"
        (click)="switch('customers')">
        <div class="tab-icon">
          <i class="fas fa-users"></i>
        </div>
        <div class="tab-content">
          <span class="tab-title">Customers</span>
          <span class="tab-subtitle">Payment Status</span>
        </div>
      </button>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="payments-main">

    <!-- Content Header -->
    <div class="content-header">
      <div class="content-title">
        <h3><i [class]="getActiveIcon()"></i> {{getActiveTitle()}}</h3>
        <div class="content-subtitle">{{getActiveSubtitle()}}</div>
      </div>

      <div class="content-tools">
        <button class="tool-btn" (click)="refreshContent()" [disabled]="loading" title="Refresh">
          <i class="fas fa-sync-alt" [class.spin]="loading"></i>
          <span class="tool-text">Refresh</span>
        </button>
        <button class="tool-btn" (click)="exportData()" title="Export Data">
          <i class="fas fa-download"></i>
          <span class="tool-text">Export</span>
        </button>
      </div>
    </div>

    <!-- Content Body -->
    <div class="content-body">

      <!-- Loading State -->
      <div *ngIf="loading" class="loading-state">
        <div class="spinner"></div>
        <p>Loading {{getActiveLabel()}}...</p>
      </div>

      <!-- Component Content -->
      <div *ngIf="!loading" class="component-content">
        <!-- Payment Reports -->
        <div *ngIf="activeSection === 'reports'" class="component-section">
          <div class="section-header">
            <h4><i class="fas fa-chart-line"></i> Payment Analytics & Reports</h4>
          </div>
          <app-payment-report></app-payment-report>
        </div>

        <!-- Pending Handovers -->
        <div *ngIf="activeSection === 'handovers'" class="component-section">
          <div class="section-header">
            <h4><i class="fas fa-exchange-alt"></i> Manage Cash Handovers</h4>
            <button class="btn btn-sm btn-primary" (click)="refreshHandovers()">
              <i class="fas fa-sync-alt"></i> Refresh
            </button>
          </div>
          <app-pending-handovers></app-pending-handovers>
        </div>

        <!-- Customer Payment Status -->
        <div *ngIf="activeSection === 'customers'" class="component-section">
          <div class="section-header">
            <h4><i class="fas fa-user-check"></i> Customer Payment Status</h4>
            <button class="btn btn-sm btn-primary" (click)="refreshCustomers()">
              <i class="fas fa-sync-alt"></i> Refresh
            </button>
          </div>
          <app-customer-payment-status></app-customer-payment-status>
        </div>
      </div>
    </div>
  </div>
</div>
