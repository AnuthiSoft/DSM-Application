<div class="container mt-4">
  <h2>Distributor Products</h2>

  <div *ngIf="loading">Loading...</div>

  <div *ngIf="!loading && products.length === 0">
    <p>No products available.</p>
  </div>

  <div *ngIf="!loading && products.length > 0" class="row">
    <div class="col-md-3 mb-3" *ngFor="let prod of products">
      <div class="card">
        <div class="card-body">
          <img *ngIf="prod.imageUrl" [src]="'https://localhost:7189' + prod.imageUrl" class="img-fluid mb-2" />
          <h6 class="card-title">{{ prod.productName }}</h6>
          <p>Code: {{ prod.productCode }}</p>
          <p>Price: {{ prod.price }}</p>
          <p>Stock: {{ prod.stock }}</p>
          <p>Brand: {{ prod.brand }}</p>
          <p>Category: {{ prod.category }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
