<div class="container mt-4">

  <h2>My Profile</h2>

  <div *ngIf="isLoading" class="alert alert-info">
    Loading profile...
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <form *ngIf="!isLoading && customer" (ngSubmit)="saveProfile()" class="mt-3">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" [(ngModel)]="customer.name" name="name" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" [(ngModel)]="customer.email" name="email" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input type="text" class="form-control" [(ngModel)]="customer.phoneNumber" name="phone">
    </div>

    <div class="mb-3">
      <label class="form-label">Address</label>
      <textarea class="form-control" [(ngModel)]="customer.address" name="address" rows="3"></textarea>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="isSaving">
      {{ isSaving ? 'Saving...' : 'Save Changes' }}
    </button>
  </form>

</div>
