<div class="p-4">
  <h2 class="text-xl font-bold">Set Password</h2>
  <form (ngSubmit)="setPassword()" class="flex flex-col gap-2">
    <input type="email" placeholder="Email" [(ngModel)]="email" name="email" required />
    <input type="password" placeholder="New Password" [(ngModel)]="password" name="password" required />
    <button type="submit">Set Password</button>
  </form>
  <p class="text-green-600">{{ message }}</p>
  <p class="text-red-600">{{ error }}</p>
</div>
