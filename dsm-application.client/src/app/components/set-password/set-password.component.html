<div class="set-password-section">
  <div class="password-card">
    <div class="card-header">
      <h2><i class="fas fa-lock"></i> Set Password</h2>
    </div>

    <form (ngSubmit)="setPassword()" class="password-form">
      <div class="form-group">
        <label class="form-label">
          <i class="fas fa-envelope"></i>
          Email or Phone Number
        </label>
        <input 
          type="text" 
          class="form-control"
          placeholder="Enter your email or phone number" 
          [(ngModel)]="identifier" 
          name="identifier" 
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label">
          <i class="fas fa-key"></i>
          New Password
        </label>
        <input 
          type="password" 
          class="form-control"
          placeholder="Enter your new password" 
          [(ngModel)]="password" 
          name="password" 
          required
        />
        <div class="password-strength">
          <div class="strength-bar" [class]="getPasswordStrength()">
            <div class="strength-fill"></div>
          </div>
          <span class="strength-text">{{ getPasswordStrengthText() }}</span>
        </div>
      </div>

      <div class="password-requirements">
        <h4><i class="fas fa-info-circle"></i> Password Requirements</h4>
        <ul>
          <li [class.requirement-met]="hasMinLength()">
            <i class="fas" [class.fa-check]="hasMinLength()" [class.fa-times]="!hasMinLength()"></i>
            At least 8 characters
          </li>
          <li [class.requirement-met]="hasUpperCase()">
            <i class="fas" [class.fa-check]="hasUpperCase()" [class.fa-times]="!hasUpperCase()"></i>
            One uppercase letter
          </li>
          <li [class.requirement-met]="hasLowerCase()">
            <i class="fas" [class.fa-check]="hasLowerCase()" [class.fa-times]="!hasLowerCase()"></i>
            One lowercase letter
          </li>
          <li [class.requirement-met]="hasNumber()">
            <i class="fas" [class.fa-check]="hasNumber()" [class.fa-times]="!hasNumber()"></i>
            One number
          </li>
        </ul>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="!isFormValid() || isProcessing">
          <i class="fas" [class.fa-lock]="!isProcessing" [class.fa-spinner]="isProcessing" [class.fa-spin]="isProcessing"></i>
          {{ isProcessing ? 'Setting Password...' : 'Set Password' }}
        </button>
      </div>
    </form>

    <!-- Success Message -->
    <div *ngIf="message" class="message-success">
      <i class="fas fa-check-circle"></i>
      <div class="message-content">
        <h4>Password Set Successfully!</h4>
        <p>{{ message }}</p>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="message-error">
      <i class="fas fa-exclamation-triangle"></i>
      <div class="message-content">
        <h4>Error Setting Password</h4>
        <p>{{ error }}</p>
      </div>
    </div>
  </div>
</div>
