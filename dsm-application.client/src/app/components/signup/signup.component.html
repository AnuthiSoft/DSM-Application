<div class="container mt-5">
  <h2>Create Password (Sign Up)</h2>
  <form (ngSubmit)="onSignup()">
    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="email" name="email" type="email" class="form-control" required>
    </div>
    <div class="form-group mt-2">
      <label>Password</label>
      <input [(ngModel)]="password" name="password" type="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-success mt-3">Sign Up</button>
    <p class="text-success mt-2">{{ message }}</p>
    <p class="text-danger mt-2">{{ error }}</p>
  </form>
   <p class="mt-3">Already have a password? <a routerLink="/login">Login</a></p>
</div>
